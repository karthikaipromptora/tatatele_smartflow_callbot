[project]
name = "tatatele-smartflow-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pipecat-ai[openai,sarvam]==1.0.0",
    "fastapi==0.135.3",
    "uvicorn[standard]==0.44.0",
    "asyncpg==0.31.0",
